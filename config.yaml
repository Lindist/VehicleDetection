system:
  headless: auto  # auto: ตรวจจับอัตโนมัติ (SSH จะเปิดหลังบ้าน, จอเปิด GUI), true: หลังบ้านเพียวๆ, false: เปิดหน้าต่าง

camera:
  source: 0
  width: 640
  height: 480
  process_fps: 5        # ความเร็วประมวลผลเมื่อพบรถ (Active Mode)
  idle_fps: 0.5         # ความเร็วตอนไม่มีรถ (Sleep Mode: 0.5 = ตรวจ 1 ครั้ง ทุก 2 วินาที)
  idle_timeout: 10      # ไม่พบรถนานกี่วินาทีจึงเข้าโหมด Sleep (ใส่ 0 เพื่อปิดโหมดประหยัดพลังงาน)
model:
  path: models/best.pt
  conf: 0.45
  authorized_classes: [ambulance]
  unauthorized_classes: [car, bus, truck, motorcycle, van]
parking: {grace_period_seconds: 5, movement_threshold_pixels: 25, alert_interval_seconds: 8}
audio: {file: assets/alert.mp3, volume: 1.0}
roi_polygon:
- [85, 63]
- [88, 320]
- [552, 289]
- [562, 68]
